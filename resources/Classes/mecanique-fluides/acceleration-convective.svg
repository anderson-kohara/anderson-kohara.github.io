<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" role="img" aria-labelledby="title"><title id="title">Accélération convective dans une conduite convergente</title><rect width="760" height="380" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="context-stroke"/></marker></defs><g font-family="Arial,sans-serif" font-size="22" fill="#17201e" stroke-linejoin="round"><path d="M50 90H260L530 140H710V260H530L260 310H50Z" fill="#e3f1f6"/><path d="M50 90H260L530 140H710M50 310H260L530 260H710" fill="none" stroke="#405b55" stroke-width="4"/><g stroke="#337b9a" stroke-width="4" marker-end="url(#arrow)"><path d="M100 200H170M290 200H400M520 200H680"/></g><text x="120" y="180">v₁</text><text x="330" y="180">v₂</text><text x="585" y="180">v₃</text><text x="380" y="40" text-anchor="middle">Écoulement stationnaire · v₁ &lt; v₂ &lt; v₃</text><text x="380" y="355" text-anchor="middle" font-size="19">Une particule accélère en traversant le rétrécissement.</text></g></svg>